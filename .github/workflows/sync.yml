name: Sinkron otomatis (Drive, YouTube, Audio)

on:
  schedule:
    - cron: '17 * * * *' # setiap jam, menit ke-17
  workflow_dispatch:
    inputs:
      max_audio:
        description: 'Maksimal audio yang dibuat sekali jalan'
        default: '3'

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pasang alat
        run: |
          cd scripts && npm ci --no-audit --no-fund
          pip install --quiet --upgrade edge-tts
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Sinkron
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
          GH_TOKEN: ${{ github.token }}
          MAX_AUDIO_PER_RUN: ${{ inputs.max_audio || '3' }}
        run: node scripts/sync/index.mjs

      - name: Terbitkan perubahan isi
        run: |
          git config user.name "quran-inspiration-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if ! git diff --cached --quiet; then
            git commit -m "Sinkron otomatis: perbarui isi web"
            git push origin HEAD:main
            if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" > /dev/null; fi
          else
            echo "Tidak ada perubahan isi."
          fi

      - name: Catat status untuk halaman admin
        if: always()
        run: |
          [ -f .sync/status.json ] || echo '{"lastSync":"'"$(date -u +%FT%TZ)"'","errors":["Sinkron gagal sebelum selesai. Lihat tab Actions di GitHub."]}' > .sync/status.json
          rm -rf /tmp/status && mkdir /tmp/status && cp .sync/status.json /tmp/status/
          cd /tmp/status
          git init -q -b status
          git config user.name "quran-inspiration-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json && git commit -qm "Status sinkron $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status
